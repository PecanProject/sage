id: web-tokens
language: tsx
severity: error
message: Use a design token from web/src/index.css, not a Tailwind default or a one-off value.
note: |
  The theme resets colour, type, radius and shadow to SAGE's own steps, so a Tailwind default renders nothing.
  Type is a role (text-wordmark, display, title, value, name, body, label, control, caption) that sets size, weight and tracking.
  Spacing is the 4px scale plus inset, gutter, control, control-sm and icon. Radius is control, card, page,
  inline, bar, mark, highlight or full. Colours and shadows are the named ones. A one-off size or colour that
  matters belongs in index.css as a token; widths, grid templates and transitions may stay arbitrary.
files:
  - web/src/**/*.tsx
  - web/src/**/*.ts
ignores:
  - web/src/api/schema.d.ts
rule:
  kind: string_fragment
  any:
    - regex: '(^|[\s:"`!])-?(text-(xs|sm|base|lg|[2-9]?xl|micro)|rounded(-[trblse]{1,2})?(-(xs|sm|md|lg|[2-4]?xl|none))?|shadow(-(2xs|xs|sm|md|lg|[2-9]?xl))?|(text|bg|border(-[trblxy])?|outline|ring|fill|stroke|divide|from|via|to|decoration|caret|accent|placeholder)-(black|white|slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)(-\d+)?)($|[\s"`/])'
    - regex: '(^|[\s:"`!])-?((text|bg|fill|stroke|shadow|rounded(-[trblse]{1,2})?|font|tracking|leading|z|[pm][trblxyse]?|gap(-[xy])?|space-[xy]|size)-\[|(border(-[trblxy])?|outline|ring)-\[(#|rgb|hsl|okl|color|var|--))'
